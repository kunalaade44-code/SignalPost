[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalpost"
version = "0.1.0"
description = "Signalpost: Autonomous Agent for Norwegian Company Profiling & Verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Signalpost Team" }
]

dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "uvicorn[standard]>=0.31.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.35",
    "beautifulsoup4>=4.12.3",
    "rapidfuzz>=3.10.0",
    "tldextract>=5.1.2",
    "trafilatura>=1.12.0",
    "selectolax>=0.3.27",
    "langgraph>=0.2.35",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.6.9",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
